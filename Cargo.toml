[package]
name = "nonmax"
description = "Numeric types that cannot hold maximum values"
version = "0.5.5"
authors = ["Lucien Greathouse <me@lpghatguy.com>"]
edition = "2018"
documentation = "https://docs.rs/nonmax"
homepage = "https://github.com/LPGhatguy/nonmax"
repository = "https://github.com/LPGhatguy/nonmax"
readme = "README.md"
keywords = ["nonmax", "non-max", "nonzero", "non-zero"]
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["std"]
std = []
simple_endian = [ "dep:simple_endian" ]

[dependencies]
serde = { version = "1.0", default-features = false, optional = true }

# TODO use upsream version once merged and released
# TODO create PR for nonmax
simple_endian = { version = "0.3.2", git = "https://github.com/Wasabi375/simple-endian-rs.git", branch = "const" , optional = true }

[dev-dependencies]
bincode = "1.3"
